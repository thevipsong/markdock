<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="nebula-light-base" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#f8f6fc"/>
      <stop offset="60%" stop-color="#f1f3f9"/>
      <stop offset="100%" stop-color="#eaf0f7"/>
    </radialGradient>
    <radialGradient id="nebula-light-pink" cx="28%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#FB7185" stop-opacity="0.10"/>
      <stop offset="85%" stop-color="#FDA4AF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-light-blue" cx="72%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.26"/>
      <stop offset="45%" stop-color="#818CF8" stop-opacity="0.12"/>
      <stop offset="80%" stop-color="#C7D2FE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-light-center" cx="48%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.10"/>
      <stop offset="90%" stop-color="#DDD6FE" stop-opacity="0"/>
    </radialGradient>
    <filter id="cosmic-light-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#nebula-light-base)"/>
  <g filter="url(#cosmic-light-blur)">
    <circle cx="550" cy="450" r="420" fill="url(#nebula-light-pink)"/>
    <circle cx="1380" cy="520" r="480" fill="url(#nebula-light-blue)"/>
    <ellipse cx="960" cy="500" rx="520" ry="320" fill="url(#nebula-light-center)"/>
  </g>
  <!-- Star cluster -->
  <g fill="#6366F1" opacity="0.35">
    <circle cx="960" cy="500" r="2" fill="#8B5CF6"/>
    <circle cx="820" cy="420" r="1.6"/>
    <circle cx="1120" cy="560" r="1.5"/>
    <circle cx="680" cy="360" r="1.3"/>
    <circle cx="1260" cy="420" r="1.4"/>
    <circle cx="340" cy="200" r="1.2" opacity="0.25"/>
    <circle cx="1600" cy="280" r="1.3" opacity="0.25"/>
    <circle cx="200" cy="800" r="1.1" opacity="0.2"/>
    <circle cx="1750" cy="780" r="1.4" opacity="0.2"/>
    <circle cx="1040" cy="220" r="1.2"/>
    <circle cx="520" cy="720" r="1.1"/>
  </g>
</svg>
