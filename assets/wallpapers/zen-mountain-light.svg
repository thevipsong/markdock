<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="zen-light-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="55%" stop-color="#e8eef5"/>
      <stop offset="100%" stop-color="#dde5ed"/>
    </linearGradient>
    <radialGradient id="zen-light-sun" cx="50%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.10"/>
      <stop offset="80%" stop-color="#E2E8F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountain-light-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="mountain-light-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="mist-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#zen-light-sky)"/>
  <!-- Morning Sun Glow -->
  <circle cx="960" cy="520" r="380" fill="url(#zen-light-sun)"/>
  <!-- Far Mountains -->
  <path d="M-100 780 L 320 540 L 780 720 L 1240 510 L 1680 690 L 2020 560 L 2020 1080 L -100 1080 Z" fill="url(#mountain-light-back)"/>
  <!-- Soft Mist between layers -->
  <rect y="600" width="100%" height="480" fill="url(#mist-light)"/>
  <!-- Near Mountains -->
  <path d="M-100 890 L 260 680 L 640 850 L 1020 650 L 1500 860 L 1880 710 L 2020 780 L 2020 1080 L -100 1080 Z" fill="url(#mountain-light-front)"/>
</svg>
