<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="dusk-light-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8f1"/>
      <stop offset="40%" stop-color="#ffedd5"/>
      <stop offset="70%" stop-color="#fee2e2"/>
      <stop offset="90%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </linearGradient>
    <radialGradient id="sun-light-horizon" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#FB7185" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
    <filter id="dusk-light-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#dusk-light-sky)"/>
  <rect width="100%" height="100%" fill="url(#sun-light-horizon)"/>
  <g opacity="0.6" filter="url(#dusk-light-blur)">
    <ellipse cx="960" cy="880" rx="800" ry="240" fill="#FB923C" opacity="0.22"/>
  </g>
  <!-- Silhouette Dunes in warm terracotta tones -->
  <path d="M-100 950 Q 420 860 960 920 T 2020 890 L 2020 1080 L -100 1080 Z" fill="#C2410C" opacity="0.22"/>
  <path d="M-100 1000 Q 600 920 1250 970 T 2020 940 L 2020 1080 L -100 1080 Z" fill="#9A3412" opacity="0.28"/>
</svg>
