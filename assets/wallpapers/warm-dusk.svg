<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="dusk-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181124"/>
      <stop offset="40%" stop-color="#2d1738"/>
      <stop offset="70%" stop-color="#4a1c3d"/>
      <stop offset="90%" stop-color="#6e2d3b"/>
      <stop offset="100%" stop-color="#8f443b"/>
    </linearGradient>
    <radialGradient id="sun-horizon" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#F43F5E" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="dusk-blur" x="-20%" y="-20%" width="140%" height="140%">
