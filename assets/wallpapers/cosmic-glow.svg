<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="nebula-base" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#140f2d"/>
      <stop offset="60%" stop-color="#0a0817"/>
      <stop offset="100%" stop-color="#04030a"/>
    </radialGradient>
    <radialGradient id="nebula-pink" cx="28%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#BE185D" stop-opacity="0.12"/>
      <stop offset="85%" stop-color="#831843" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-blue" cx="72%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="80%" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-center" cx="48%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.12"/>
      <stop offset="90%" stop-color="#4C1D95" stop-opacity="0"/>
    </radialGradient>
    <filter id="cosmic-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#nebula-base)"/>
  <g filter="url(#cosmic-blur)">
    <circle cx="550" cy="450" r="420" fill="url(#nebula-pink)"/>
    <circle cx="1380" cy="520" r="480" fill="url(#nebula-blue)"/>
    <ellipse cx="960" cy="500" rx="520" ry="320" fill="url(#nebula-center)"/>
  </g>
  <!-- Star cluster -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="960" cy="500" r="2.2" fill="#FDF4FF"/>
    <circle cx="820" cy="420" r="1.8"/>
    <circle cx="1120" cy="560" r="1.6"/>
    <circle cx="680" cy="360" r="1.4"/>
    <circle cx="1260" cy="420" r="1.5"/>
    <circle cx="340" cy="200" r="1.2" opacity="0.4"/>
    <circle cx="1600" cy="280" r="1.4" opacity="0.4"/>
    <circle cx="200" cy="800" r="1.2" opacity="0.3"/>
    <circle cx="1750" cy="780" r="1.5" opacity="0.3"/>
    <circle cx="1040" cy="220" r="1.3"/>
    <circle cx="520" cy="720" r="1.2"/>
  </g>
</svg>
