<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7fb" />
    <title>栖点 · 我的书签</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script src="./theme-init.js"></script>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
    <script src="./appearance.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#content">跳到书签内容</a>
    <div class="backdrop" aria-hidden="true"><div class="backdrop-glow"></div></div>
    <main class="app-window">
      <header class="titlebar">
        <div class="titlebar-left">
          <h1 class="brand" aria-label="栖点"><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5h10a1 1 0 0 1 1 1v14.2l-6-3.6-6 3.6V5.5a1 1 0 0 1 1-1Z" fill="currentColor"/></svg></span><span>栖点</span></h1>
          <span class="header-count" id="countLine">把常用网站放在触手可及的地方</span>
        </div>
        <label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="searchInput" type="search" placeholder="搜索名称、网址或拼音首字母" aria-label="搜索名称、网址或拼音首字母" autocomplete="off" /><kbd>/</kbd></label>
        <div class="titlebar-right">
          <span class="private-badge" id="syncBadge"><span></span><span id="syncBadgeText">本地保存</span></span>
          <div class="actions-wrap"><button class="button button-quiet" id="actionsButton" type="button" aria-expanded="false" aria-controls="actionsMenu">操作 <span class="chevron">⌄</span></button><div class="actions-menu" id="actionsMenu" hidden>
            <button id="addButton" type="button">添加本地书签</button>
            <button id="importButton" type="button">导入本地书签</button>
            <button id="exportButton" type="button" aria-expanded="false" aria-controls="exportMenu">导出书签 <span class="chevron">›</span></button>
            <div class="export-menu" id="exportMenu" hidden><button type="button" data-export="html">浏览器书签 HTML</button><button type="button" data-export="json">JSON 备份</button></div>
            <button id="duplicateButton" type="button">查找重复书签</button>
            <button id="deadLinkButton" type="button">检查失效链接</button>
          </div></div>
          <button class="theme-toggle" id="appearanceButton" type="button" aria-label="背景设置" title="背景设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M6 16l3-8 4 5 3-3 3 6H6Z"/><circle cx="17" cy="6" r="2"/></svg></button>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换暗黑模式" title="切换暗黑模式">
            <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.1 15.7A8.7 8.7 0 0 1 8.3 3.9 8.8 8.8 0 1 0 20.1 15.7Z"/></svg>
            <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.7"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </header>
      <nav class="tabs" id="tabs" aria-label="书签分类"></nav>
      <input id="fileInput" type="file" accept=".html,.htm,.json,text/html,application/json" hidden />

      <div class="demo-banner" id="demoBanner" hidden><span class="demo-sparkle">✦</span><span>这里展示的是示例书签。</span><button id="demoImportButton" type="button">导入我的书签 <span aria-hidden="true">→</span></button></div>
      <section class="content" id="content" aria-live="polite"></section>
      <footer class="app-footer"><span>栖点 · 给书签一个清爽的家</span><span id="footerCount"></span></footer>
    </main>

    <dialog id="bookmarkDialog" class="bookmark-dialog" aria-labelledby="dialogTitle">
      <form id="bookmarkForm" novalidate>
        <div class="dialog-heading"><div><p class="eyebrow">BOOKMARK</p><h2 id="dialogTitle">添加书签</h2></div><button class="icon-button" id="closeDialogButton" type="button" aria-label="关闭">×</button></div>
        <label class="field"><span>名称</span><input id="titleField" name="title" required maxlength="512" placeholder="例如：我的工作台" /></label>
        <label class="field"><span>网址</span><input id="urlField" name="url" required type="text" inputmode="url" placeholder="https://example.com" /></label>
        <div class="field-grid"><label class="field"><span>分类</span><input id="categoryField" name="category" list="categorySuggestions" maxlength="50" placeholder="例如：工作" /><datalist id="categorySuggestions"></datalist></label><label class="field"><span>分组</span><input id="groupField" name="group" maxlength="100" placeholder="例如：常用工具" /></label></div>
        <label class="favorite-check"><input id="favoriteField" name="favorite" type="checkbox" /><span>加入收藏</span></label>
        <p class="dialog-hint" id="chromeEditHint" hidden>此书签来自 Chrome；修改名称和网址会同步写回 Chrome。移动文件夹请使用右键菜单。</p>
        <p class="form-error" id="formError" role="alert" hidden></p>
        <div class="dialog-actions"><button class="button button-danger" id="deleteButton" type="button" hidden>删除书签</button><span class="dialog-spacer"></span><button class="button button-quiet" id="cancelDialogButton" type="button">取消</button><button class="button button-primary" type="submit">保存书签</button></div>
      </form>
    </dialog>
    <dialog id="moveDialog" class="bookmark-dialog" aria-labelledby="moveTitle"><form id="moveForm">
      <div class="dialog-heading"><div><p class="eyebrow">ORGANIZE</p><h2 id="moveTitle">移动到分组</h2></div><button class="icon-button" type="button" data-close-dialog="moveDialog" aria-label="关闭">×</button></div>
      <label class="field"><span>目标分组</span><select id="moveTarget" required></select></label>
      <label class="field"><span>新建子分组（可选）</span><input id="newGroupName" maxlength="80" placeholder="留空则直接移入选中的分组" /></label>
      <p class="dialog-hint">Chrome 书签的移动会写回 Chrome。</p>
      <div class="dialog-actions"><span class="dialog-spacer"></span><button class="button button-quiet" type="button" data-close-dialog="moveDialog">取消</button><button class="button button-primary" type="submit">移动书签</button></div>
    </form></dialog>
    <dialog id="auditDialog" class="bookmark-dialog audit-dialog" aria-labelledby="auditTitle"><div class="dialog-heading"><div><p class="eyebrow">CLEANUP</p><h2 id="auditTitle">书签检查</h2></div><button class="icon-button" type="button" data-close-dialog="auditDialog" aria-label="关闭">×</button></div><p id="auditSummary"></p><div id="auditResults" class="audit-results"></div><div class="dialog-actions"><span class="dialog-spacer"></span><button class="button button-quiet" type="button" data-close-dialog="auditDialog">关闭</button><button class="button button-danger" id="mergeDuplicatesButton" type="button" hidden>合并完全重复的网址</button></div></dialog>
    <dialog id="appearanceDialog" class="bookmark-dialog" aria-labelledby="appearanceTitle"><div class="dialog-heading"><div><p class="eyebrow">APPEARANCE</p><h2 id="appearanceTitle">背景设置</h2></div><button class="icon-button" type="button" data-close-dialog="appearanceDialog" aria-label="关闭">×</button></div><div class="preset-grid" id="presetGrid"></div><label class="field"><span>上传背景图片</span><input id="backgroundFile" type="file" accept="image/*" /></label><p class="dialog-hint" id="appearanceStatus">图片保存在当前浏览器，刷新后仍会显示。</p><label class="range-field"><span>模糊强度 <output id="blurValue"></output></span><input id="blurRange" type="range" min="0" max="40" step="1" /></label><label class="range-field"><span>遮罩浓度 <output id="overlayValue"></output></span><input id="overlayRange" type="range" min="0" max="80" step="1" /></label><div class="dialog-actions"><button class="button button-quiet" id="removeBackground" type="button">恢复默认</button><span class="dialog-spacer"></span><button class="button button-primary" type="button" data-close-dialog="appearanceDialog">完成</button></div></dialog>
    <div class="context-menu" id="contextMenu" role="menu" hidden><button type="button" data-action="open" role="menuitem">打开书签</button><button type="button" data-action="edit" role="menuitem">编辑书签</button><button type="button" data-action="move" role="menuitem">移动分组</button><button type="button" data-action="delete" role="menuitem">删除书签</button></div>
    <div class="bookmark-tooltip" id="bookmarkTooltip" role="tooltip" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
